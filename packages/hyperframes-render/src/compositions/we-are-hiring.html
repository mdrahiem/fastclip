<!doctype html>
<html
  data-composition-variables='[
    {"id":"title1","type":"string","label":"Job Title 1","default":"Software Engineer"},
    {"id":"title2","type":"string","label":"Job Title 2","default":"Product Manager"},
    {"id":"title3","type":"string","label":"Job Title 3","default":"UX Designer"},
    {"id":"title4","type":"string","label":"Job Title 4","default":"Data Scientist"},
    {"id":"aspectRatio","type":"enum","label":"Aspect Ratio","default":"16:9","options":[
      {"value":"16:9","label":"Landscape (16:9)"},
      {"value":"9:16","label":"Portrait (9:16)"}
    ]}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000814;
      }

      /* ── Root ── */
      [data-composition-id="root"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #000814;
        overflow: hidden;
        font-family: "Barlow Condensed", "Barlow", sans-serif;
      }

      /* ── Background decoratives ── */
      .bg-glow-top {
        position: absolute;
        width: 700px;
        height: 700px;
        top: -200px;
        right: -100px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(252,163,17,0.18) 0%, rgba(0,8,20,0) 70%);
        pointer-events: none;
      }
      .bg-glow-bottom {
        position: absolute;
        width: 600px;
        height: 600px;
        bottom: -200px;
        left: 600px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(46,196,182,0.1) 0%, rgba(0,8,20,0) 70%);
        pointer-events: none;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(252,163,17,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(252,163,17,0.035) 1px, transparent 1px);
        background-size: 96px 96px;
        pointer-events: none;
      }
      .bg-accent-stripe {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 5px;
        background: linear-gradient(180deg, transparent 0%, #fca311 20%, #fca311 80%, transparent 100%);
        opacity: 0;
        transform-origin: center top;
      }
      /* Ghost word — decorative, intentionally overflows right */
      .bg-ghost {
        position: absolute;
        bottom: 30px;
        right: -40px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 280px;
        color: rgba(252,163,17,0.055);
        text-transform: uppercase;
        letter-spacing: -0.04em;
        line-height: 1;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }

      /* ── Corner tag ── */
      .corner-tag {
        position: absolute;
        top: 52px;
        right: 64px;
        font-family: "JetBrains Mono", "DM Mono", monospace;
        font-size: 13px;
        font-weight: 400;
        color: rgba(229,229,229,0.32);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0;
      }

      /* ── Right column — decorative role counter ── */
      .role-counter {
        position: absolute;
        right: 120px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
      }
      .role-counter-num {
        font-family: "JetBrains Mono", monospace;
        font-size: 72px;
        font-weight: 600;
        color: #fca311;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .role-counter-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 400;
        color: rgba(229,229,229,0.3);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .role-counter-bar {
        width: 1px;
        height: 80px;
        background: linear-gradient(180deg, #fca311 0%, transparent 100%);
      }

      /* ── Main content ── */
      /* Layout: fixed left-aligned block, vertically centered */
      .scene-content {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 1360px; /* leave right 560px for counter + padding */
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 0 80px 100px;
        gap: 0;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        color: #fca311;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        margin-bottom: 18px;
        opacity: 0;
      }

      /* Single-line headline — fixed 96px, no overflow */
      .headline {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 96px;
        color: #e5e5e5;
        text-transform: uppercase;
        letter-spacing: -0.025em;
        line-height: 0.95;
        margin-bottom: 12px;
        opacity: 0;
      }
      .headline-accent {
        color: #fca311;
        display: block;
      }

      /* Rule */
      .divider {
        width: 100%;
        max-width: 900px;
        height: 2px;
        background: linear-gradient(90deg, #fca311 0%, rgba(252,163,17,0.1) 100%);
        margin-bottom: 36px;
        transform-origin: left center;
        transform: scaleX(0);
        opacity: 0;
      }

      /* ── Title slots ── */
      .title-slot {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 16px;
        opacity: 0;
      }
      .title-slot:last-child { margin-bottom: 0; }

      .slot-index {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 400;
        color: rgba(252,163,17,0.4);
        letter-spacing: 0.1em;
        width: 20px;
        text-align: right;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }

      .slot-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(252,163,17,0.35);
        flex-shrink: 0;
        transition: none;
      }

      .slot-text {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 52px;
        color: rgba(229,229,229,0.5);  /* visible on dark bg */
        letter-spacing: -0.01em;
        line-height: 1;
      }

      /* Active state — applied via GSAP */
      .slot-text.is-active {
        color: #ffffff;
      }

      /* ── Bottom ticker ── */
      .ticker {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 52px;
        background: #fca311;
        display: flex;
        align-items: center;
        padding: 0 60px;
        gap: 32px;
        opacity: 0;
        transform: translateY(52px);
      }
      .ticker-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 600;
        color: #000814;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .ticker-sep {
        width: 1px; height: 18px;
        background: rgba(0,8,20,0.25);
        flex-shrink: 0;
      }
      .ticker-roles {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: #000814;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body style="background:#000814;margin:0;padding:0;">
    <div
      id="root"
      class="clip"
      data-composition-id="root"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
      data-track-index="0"
      style="background:#000814;width:1920px;height:1080px;position:relative;overflow:hidden;"
    >
      <!-- Background -->
      <div id="glow-top" class="bg-glow-top" data-layout-ignore></div>
      <div id="glow-bot" class="bg-glow-bottom" data-layout-ignore></div>
      <div id="grid"    class="bg-grid"    data-layout-ignore></div>
      <div id="stripe"  class="bg-accent-stripe" data-layout-ignore></div>
      <div id="ghost"   class="bg-ghost"   data-layout-allow-overflow>HIRING</div>

      <!-- Corner -->
      <div id="corner" class="corner-tag">Now Hiring</div>

      <!-- Right counter (decorative) -->
      <div id="counter" class="role-counter" data-layout-ignore>
        <div class="role-counter-bar"></div>
        <div class="role-counter-num" id="counter-num">04</div>
        <div class="role-counter-label">Open Roles</div>
      </div>

      <!-- Main content -->
      <div class="scene-content">
        <div id="eyebrow" class="eyebrow">We Are</div>
        <div id="headline" class="headline">
          Hiring<span class="headline-accent" id="accent">Talent</span>
        </div>
        <div id="divider" class="divider"></div>

        <div id="slot1" class="title-slot">
          <span class="slot-index">01</span>
          <span class="slot-dot" id="dot1"></span>
          <span class="slot-text" id="t1">—</span>
        </div>
        <div id="slot2" class="title-slot">
          <span class="slot-index">02</span>
          <span class="slot-dot" id="dot2"></span>
          <span class="slot-text" id="t2">—</span>
        </div>
        <div id="slot3" class="title-slot">
          <span class="slot-index">03</span>
          <span class="slot-dot" id="dot3"></span>
          <span class="slot-text" id="t3">—</span>
        </div>
        <div id="slot4" class="title-slot">
          <span class="slot-index">04</span>
          <span class="slot-dot" id="dot4"></span>
          <span class="slot-text" id="t4">—</span>
        </div>
      </div>

      <!-- Ticker -->
      <div id="ticker" class="ticker">
        <span class="ticker-label">Join Us</span>
        <div class="ticker-sep"></div>
        <span class="ticker-roles" id="ticker-roles">—</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // ── Variables ──────────────────────────────────────────────────
      const vars = window.__hyperframes
        ? window.__hyperframes.getVariables()
        : { title1: "Software Engineer", title2: "Product Manager",
            title3: "UX Designer",       title4: "Data Scientist",
            aspectRatio: "16:9" };

      const titles = [vars.title1, vars.title2, vars.title3, vars.title4];

      document.getElementById("t1").textContent = titles[0];
      document.getElementById("t2").textContent = titles[1];
      document.getElementById("t3").textContent = titles[2];
      document.getElementById("t4").textContent = titles[3];
      document.getElementById("ticker-roles").textContent =
        titles.join("  ·  ");

      // Portrait overrides — applied after render-we-are-hiring.ts patches the
      // static HTML dimensions so the HyperFrames viewport is already 1080×1920.
      if (vars.aspectRatio === "9:16") {
        // Ensure dimensions are set (belt-and-suspenders)
        ["html","body"].forEach(sel => {
          const el = document.querySelector(sel);
          if (el) { el.style.width = "1080px"; el.style.height = "1920px"; }
        });
        const root = document.getElementById("root");
        root.setAttribute("data-width",  "1080");
        root.setAttribute("data-height", "1920");
        root.style.width  = "1080px";
        root.style.height = "1920px";

        // Scene content: full-width, vertically centered in 1920px canvas
        const sc = document.querySelector(".scene-content");
        sc.style.width   = "100%";
        sc.style.padding = "120px 80px 120px 80px";

        // Headline: slightly smaller for portrait width
        document.querySelector(".headline").style.fontSize = "80px";

        // Title slots: scale down slightly so all 4 fit comfortably
        document.querySelectorAll(".slot-text").forEach(el => {
          el.style.fontSize = "44px";
        });

        // Divider: cap width for portrait
        document.querySelector(".divider").style.maxWidth = "100%";

        // Move role counter to top-right instead of vertically-centred
        const counter = document.getElementById("counter");
        counter.style.top       = "80px";
        counter.style.right     = "60px";
        counter.style.transform = "none";

        // Ghost text: smaller so it doesn't overwhelm the narrow canvas
        document.querySelector(".bg-ghost").style.fontSize = "180px";
      }

      // ── Timeline ───────────────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── Ambient background (seekable) ─────────────────────────────
      tl.fromTo("#glow-top",
        { scale: 0.92, opacity: 0.8 },
        { scale: 1.07, opacity: 1, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
      tl.fromTo("#glow-bot",
        { scale: 1.05, opacity: 0.5 },
        { scale: 0.93, opacity: 0.85, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);
      tl.fromTo("#grid",
        { opacity: 0.5 },
        { opacity: 1, duration: 7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // Ghost text slow right-to-left drift
      tl.fromTo("#ghost",
        { x: 0 },
        { x: -60, duration: 15, ease: "none" }, 0);

      // ── Stripe entrance ───────────────────────────────────────────
      tl.fromTo("#stripe",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.1);

      // ── Corner tag ────────────────────────────────────────────────
      tl.fromTo("#corner",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.5);

      // ── Headline block entrance ───────────────────────────────────
      tl.fromTo("#eyebrow",
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.25);

      tl.fromTo("#headline",
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.65, ease: "expo.out" }, 0.45);

      tl.fromTo("#divider",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.out" }, 0.85);

      // ── Ticker entrance ───────────────────────────────────────────
      tl.fromTo("#ticker",
        { y: 52, opacity: 0 },
        { y: 0,  opacity: 1, duration: 0.5, ease: "power3.out" }, 0.9);

      // ── Title slots — staggered entrance ─────────────────────────
      // All 4 titles reveal within first 3 seconds
      const SLOT_START   = [1.2, 1.7, 2.2, 2.7]; // entrance start times
      const ACTIVE_START = [1.2, 4.2, 7.2, 10.2]; // when each is "highlighted"
      const ACTIVE_DUR   = 3.0;

      const slotIds = ["slot1","slot2","slot3","slot4"];
      const dotIds  = ["dot1","dot2","dot3","dot4"];
      const textIds = ["t1","t2","t3","t4"];

      slotIds.forEach((_, i) => {
        const t = SLOT_START[i];
        // Slot row fades in
        tl.fromTo(`#${slotIds[i]}`,
          { opacity: 0, x: -28 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t);
      });

      // ── Active highlight cycles ───────────────────────────────────
      // Each title gets highlighted for 3s in sequence
      slotIds.forEach((_, i) => {
        const aStart = ACTIVE_START[i];
        const aEnd   = aStart + ACTIVE_DUR;

        // Dot brightens
        tl.fromTo(`#${dotIds[i]}`,
          { backgroundColor: "rgba(252,163,17,0.35)", boxShadow: "none" },
          { backgroundColor: "#fca311", boxShadow: "0 0 16px rgba(252,163,17,0.85)",
            duration: 0.3, ease: "power2.out" }, aStart);

        // Text brightens
        tl.fromTo(`#${textIds[i]}`,
          { color: "rgba(229,229,229,0.5)" },
          { color: "#ffffff", duration: 0.3, ease: "power2.out" }, aStart);

        // Counter number updates (decorative)
        // Hard-kill on exit (all except last)
        if (i < 3) {
          tl.to(`#${dotIds[i]}`,
            { backgroundColor: "rgba(252,163,17,0.35)", boxShadow: "none",
              duration: 0.25, ease: "power1.in" }, aEnd - 0.3);
          tl.to(`#${textIds[i]}`,
            { color: "rgba(229,229,229,0.5)", duration: 0.25, ease: "power1.in" }, aEnd - 0.3);
          // Deterministic kill
          tl.set(`#${dotIds[i]}`,
            { backgroundColor: "rgba(252,163,17,0.35)", boxShadow: "none" }, aEnd);
          tl.set(`#${textIds[i]}`,
            { color: "rgba(229,229,229,0.5)" }, aEnd);
        }
      });

      // ── Right-side counter (decorative) ──────────────────────────
      tl.fromTo("#counter",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 1.0);

      // ── Final fade out ────────────────────────────────────────────
      tl.to("#root", { opacity: 0, duration: 0.7, ease: "power2.in" }, 14.3);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
